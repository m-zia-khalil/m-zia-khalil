<circle cx="16" cy="14" r="5" fill="#ff5f56"/><circle cx="32" cy="14" r="5" fill="#ffbd2e"/><circle cx="48" cy="14" r="5" fill="#27c93f"/>
<text x="160" y="18" text-anchor="middle" class="t" fill="#8b949e" font-size="11">zia@ai-lab: ~/projects</text>
<text class="t l" x="14" y="52" fill="#e6edf3" style="animation-delay:0s">$ python train.py</text>
